[project]
name = "ieum"
version = "0.1.0"
description = "사회적 고립 지원을 잇는 에이전트: 집계 신호와 지원사업 조건을 대조해 단계·할 일·정책 추천을 만듦"
requires-python = ">=3.12,<3.13"
# 공개 사이트 결과를 만든 버전에 고정함(pandas가 바뀌면 좌표 끝자리가 달라짐)
dependencies = [
    "numpy==2.5.3",
    "pandas==2.3.3",
    "pyproj==3.8.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.setuptools]
packages = ["ieum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # 줄 길이는 formatter가 맞추고, 긴 한국어 문자열·주석은 그대로 둠
    "E731",  # 짧은 lambda는 그 자리에서 읽기 쉬워서 둠
    "SIM108",
]
